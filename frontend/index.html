<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Dự Đoán Kết Quả Học Tập</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-container">
    <div class="content-wrapper">

      <div class="card prediction-card">
        <h1 class="main-title">Hệ Thống Dự Đoán Kết Quả Học Tập</h1>
        <p class="sub-title">Bài tập lớn Trí tuệ nhân tạo &mdash; Dự đoán điểm G3</p>

        <form id="predict-form">
          <div class="grid grid-3">
            <div class="form-group">
              <label for="G1">Điểm kỳ 1 (G1)</label>
              <input type="number" id="G1" name="G1" min="0" max="20" step="0.5" placeholder="0 - 20" required />
            </div>
            <div class="form-group">
              <label for="G2">Điểm kỳ 2 (G2)</label>
              <input type="number" id="G2" name="G2" min="0" max="20" step="0.5" placeholder="0 - 20" required />
            </div>
            <div class="form-group">
              <label for="age">Tuổi</label>
              <input type="number" id="age" name="age" min="15" max="22" placeholder="15 - 22" required />
            </div>
          </div>

          <div class="grid grid-3">
            <div class="form-group">
              <label for="studytime">Thời gian tự học/tuần</label>
              <select id="studytime" name="studytime" required>
                <option value="1">&lt; 2 giờ</option>
                <option value="2" selected>2 - 5 giờ</option>
                <option value="3">5 - 10 giờ</option>
                <option value="4">&gt; 10 giờ</option>
              </select>
            </div>
            <div class="form-group">
              <label for="failures">Số môn từng rớt</label>
              <select id="failures" name="failures" required>
                <option value="0" selected>Chưa từng rớt</option>
                <option value="1">1 môn</option>
                <option value="2">2 môn</option>
                <option value="3">3 môn trở lên</option>
              </select>
            </div>
            <div class="form-group">
              <label for="goout">Mức độ đi chơi</label>
              <select id="goout" name="goout" required>
                <option value="1">Rất ít</option>
                <option value="2">Ít</option>
                <option value="3" selected>Trung bình</option>
                <option value="4">Nhiều</option>
                <option value="5">Rất nhiều</option>
              </select>
            </div>
          </div>

          <div class="grid grid-3">
            <div class="form-group">
              <label for="traveltime">Thời gian đến trường</label>
              <select id="traveltime" name="traveltime" required>
                <option value="1" selected>&lt; 15 phút</option>
                <option value="2">15 - 30 phút</option>
                <option value="3">30 phút - 1 giờ</option>
                <option value="4">&gt; 1 giờ</option>
              </select>
            </div>
            <div class="form-group">
              <label for="absences">Số buổi vắng học</label>
              <input type="number" id="absences" name="absences" min="0" max="93" value="0" required />
            </div>
            <div class="form-group"></div>
          </div>

          <div class="grid grid-2">
            <div class="form-group">
              <label for="Medu">Học vấn của mẹ</label>
              <select id="Medu" name="Medu" required>
                <option value="0">Không học</option>
                <option value="1">Tiểu học</option>
                <option value="2" selected>THCS</option>
                <option value="3">THPT</option>
                <option value="4">Đại học/Cao học</option>
              </select>
            </div>
            <div class="form-group">
              <label for="Fedu">Học vấn của cha</label>
              <select id="Fedu" name="Fedu" required>
                <option value="0">Không học</option>
                <option value="1">Tiểu học</option>
                <option value="2" selected>THCS</option>
                <option value="3">THPT</option>
                <option value="4">Đại học/Cao học</option>
              </select>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">Bắt đầu phân tích AI</button>
        </form>

        <div id="result-box" class="result-box hidden">
          <h3 id="result-status" class="result-status"></h3>
          <p id="result-score" class="result-score"></p>
          <p id="result-advice" class="result-advice"></p>
        </div>

        <div id="error-box" class="error-box hidden"></div>
      </div>

      <div class="card history-card">
        <h2 class="history-title">Lịch sử dự đoán</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>G1</th>
                <th>G2</th>
                <th>Rớt môn</th>
                <th>Tuổi</th>
                <th>Học tại</th>
                <th>Đi chơi</th>
                <th>Kết quả</th>
                <th>Điểm dự đoán</th>
                <th>Thời gian</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="9" class="empty-row">Chưa có dữ liệu</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
